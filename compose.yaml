services:
  backend:
    build: .
    restart: unless-stopped
    user: "${APP_UID:-10001}:${APP_GID:-10001}"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      PUBLIC_URL: ${PUBLIC_URL:?Set the public HTTPS origin without a path}
      OAUTH_ISSUER: ${OAUTH_ISSUER:?Set the OAuth issuer}
      OAUTH_JWKS_URL: ${OAUTH_JWKS_URL:?Set the JWKS URL}
      OAUTH_AUDIENCE: ${OAUTH_AUDIENCE:?Set the access token audience}
      OWNER_SUBJECT: ${OWNER_SUBJECT:?Set your Auth0 application user ID}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      AUTH_DEBUG_USER_IDS: ${AUTH_DEBUG_USER_IDS:-0}
      DATA_DIR: /srv/data
    volumes:
      - type: bind
        source: ./data
        target: /srv/data
        bind:
          create_host_path: false
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
  tunnel:
    image: ngrok/ngrok:3
    restart: unless-stopped
    command: ["http", "--url=${NGROK_DOMAIN:-tough-jay-refined.ngrok-free.app}", "http://backend:8000"]
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:?Set the ngrok agent authtoken}
    depends_on:
      backend:
        condition: service_healthy

[project]
name = "standard-mcp-backend"
version = "0.1.0"
description = "Skill-driven MCP backend"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "mcp>=1.30,<2", "uvicorn>=0.34,<1", "pyjwt[crypto]>=2.10,<3"]

[dependency-groups]
dev = ["httpx>=0.28,<1", "pytest>=9,<10", "pytest-asyncio>=1,<2"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
